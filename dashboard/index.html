<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Defense Platform</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="dashboard">

        <header class="header">
            <div>
                <h1>Cyber Defense Platform</h1>
                <p>Security Operations Center</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                SIEM ONLINE
            </div>
        </header>


        <section class="stats-grid">

            <div class="stat-card">
                <h2>Total Events</h2>
                <div class="stat-number" id="event-count">Loading...</div>
            </div>

            <div class="stat-card">
                <h2>Total Alerts</h2>
                <div class="stat-number" id="alert-count">Loading...</div>
            </div>

            <div class="stat-card">
                <h2>Critical Alerts</h2>
                <div class="stat-number critical-number" id="critical-count">
                    Loading...
                </div>
            </div>

        </section>


        <section class="panel">

            <div class="panel-header">
                <h2>Recent Security Alerts</h2>
                <p>Latest detections generated by the SIEM detection engine</p>
            </div>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Severity</th>
                            <th>Rule</th>
                            <th>Message</th>
                            <th>Host</th>
                            <th>Process</th>
                            <th>Time</th>
                        </tr>
                    </thead>

                    <tbody id="alerts-container">
                        <tr>
                            <td colspan="6" class="empty-state">
                                Loading alerts...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/dashboard.js"></script>

</body>
</html>
